name: CI

on:
  push:
  pull_request:

jobs:
  fast-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint (Critical)
        run: ruff check . --select E9,F63,F7,F82

      - name: Syntax Smoke Test
        run: python -m compileall -q .

      - name: Run Fast Regression Tests
        run: |
          pytest tests/test_alpaca_execution.py tests/test_quant_control_state.py tests/test_alpaca_http.py tests/test_alpaca_config.py tests/test_runner_control_state.py tests/test_trade_schema_contract.py -q

  full-gate:
    runs-on: ubuntu-latest
    needs: fast-gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Full Test Suite
        run: pytest -q